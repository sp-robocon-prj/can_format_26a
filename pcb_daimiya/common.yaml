protocol:
  name: "26a_common"
  version: "1.0"
  frame_type: "CAN_FD"
  id_format: "hexadecimal"
  id_type: "STANDARD"
  arbitration_bitrate: 1000000
  data_bitrate: 2000000
  brs: true
  author: "https://github.com/earth-tk"

messages:
  - command: 0x00
    name: RESERVED
    board_id: common
    description: Reserved

  - command: 0x01
    name: EMS
    board_id: common
    description: Emergency Stop

  - command: 0x02
    name: RESET_EMS
    board_id: common
    description: Reset Emergency Stop

  - command: 0x03
    name: ID_RQ
    board_id: common
    description: Send this command to a device, and it will respond with its ID

  - command: 0x04
    name: RESERVED
    board_id: common
    description: Reserved

  - command: 0x05
    name: RESERVED
    board_id: common
    description: Reserved

  - command: 0x05
    name: RESERVED
    board_id: common
    description: Reserved

  - command: 0x06
    name: RESERVED
    board_id: common
    description: Reserved

  - command: 0x07
    name: RESERVED
    board_id: common
    description: Reserved