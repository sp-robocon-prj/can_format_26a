protocol:
  name: "26a_can_fd"
  version: "1.0"
  frame_type: "CAN_FD"
  id_format: "hexadecimal"
  id_type: "STANDARD"
  arbitration_bitrate: 1000000
  data_bitrate: 2000000
  brs: true
  author: "https://github.com/earth-tk"
  # 0x08~0x18 (24)

messages:
  - name: "NOP"
    data_id: "0x08"
    dlc: 0
    fields:
  - name: "PB_STATE"
    data_id: "0x09"
    dlc: 2
    rw: "r"
    fields:
      - name: "PB_STATE"
        byte: 0
        type: "uint8"
        description: 0で正常(非常停止解除)、1で非常停止中、2でソフトウェア非常停止、3で過電流
  - name: EMS_RQ
    data_id: "0x0A"
    dlc: 1
    rw: "w"
    fields:
      - name: EMS_RQ
        byte: 0
        type: bool
        description: 1で非常停止要求、0で解除要求。
  - name: PB_VOLTAGE
    data_id: "0x0B"
    dlc: 4
    rw: "r"
    fields:
      - name: PB_VOLTAGE
        byte: 0
        type: float
        unit: V
        description: 電源基板の電圧[V]
  - name: PBB_VOLTAGE #Power Board Battery Voltage
    data_id: "0x0B"
    dlc: 4
    rw: "r"
    fields:
      - name: PBB_VOLTAGE_1
        byte: 0
        type: float
        unit: V
        description: 電源基板の(1)バッテリー電圧[V]
      - name: PBB_VOLTAGE_2
        byte: 0
        type: float
        unit: V
        description: 電源基板の(2)バッテリー電圧[V]
  - name: PB_VOLTAGE_PERIOD
    data_id: "0x0C"
    dlc: 4
    rw: "r/w"
    fields:
      - name: PB_VOLTAGE_PERIOD
        byte: 0
        type: uint16
        unit: ms
        description: 電源基板の電圧の周期 [ms]
      - name: PBB_VOLTAGE_PERIOD
        byte: 2
        type: float
        unit: V
        description: 電源基板の各バッテリー電圧の周期[V]
  - name: OUT_I
    data_id: "0x0D"
    dlc: 4
    rw: "r"
    fields:
      - name: OUT_I
        byte: 0
        type: float
        unit: A
        description: 電源基板の出力電流[A]
  - name: OUT_I_PERIOD
    data_id: "0x0E"
    dlc: 4
    rw: "r/w"
    fields:
      - name: OUT_I_PERIOD
        byte: 0
        type: uint16
        unit: ms
        description: 電源基板の出力電流の周期 [ms]